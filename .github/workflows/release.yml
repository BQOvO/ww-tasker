name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发版的 tag（比如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原 + 编译
        run: dotnet build src/WuwaChecklist.csproj -c Release

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = 'src/bin/Release/WuwaChecklist.exe'
          if (-not (Test-Path $exe)) { throw "没生成 exe：$exe" }
          Write-Host "exe = $((Get-Item $exe).Length) bytes"

      - name: 定版本号
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 打 zip
        shell: pwsh
        run: |
          $stage = 'stage/ww-tasker'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'src/bin/Release/WuwaChecklist.exe' $stage
          Copy-Item 'data/quests.json' $stage
          Copy-Item 'README.md' $stage
          Copy-Item 'LICENSE' $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "ww-tasker.zip" -Force
          Get-Item "ww-tasker.zip" | Select-Object Name, Length

      - name: 生成更新日志
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: 没有日志就兜个底
        shell: pwsh
        run: |
          if (-not (Test-Path 'CHANGELOG.md') -or (Get-Item 'CHANGELOG.md').Length -lt 8) {
            "## ${{ steps.ver.outputs.tag }}" | Out-File 'CHANGELOG.md' -Encoding utf8
          }
          Get-Content 'CHANGELOG.md' -TotalCount 30

      - name: 发 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: CHANGELOG.md
          files: ww-tasker.zip
          draft: false
          prerelease: false
